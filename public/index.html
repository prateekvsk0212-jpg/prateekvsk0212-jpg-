<body>
<main>
<h2>August AI</h2>
<div id="authPanel">
<h3 style="color:#00e5ff">Welcome to August AI</h3>
<form id="authForm">
<input id="authEmail" type="email" placeholder="Email address" autocomplete="email" required>
<input id="authPassword" type="password" placeholder="Password (minimum 6 characters)" minlength="6" autocomplete="current-password" required>
<button id="authSubmit" type="submit">Login</button>
</form>
<button id="authToggle" type="button">Create new account</button>
<p id="authStatus">Login to continue</p>
</div>
<div id="chatArea" hidden>
<div id="messages"></div>
<p id="status">Ready to chat</p>
<form id="form">
<input id="message" placeholder="Type your message..." autocomplete="off" required>
<select id="voiceLanguage" aria-label="Voice language">
<option value="en-IN" selected>English</option>
<option value="hi-IN">Hindi</option>
<option value="bn-IN">Bengali</option>
<option value="mr-IN">Marathi</option>
<option value="ta-IN">Tamil</option>
<option value="te-IN">Telugu</option>
<option value="ur-PK">Urdu</option>
<option value="fr-FR">French</option>
<option value="es-ES">Spanish</option>
<option value="de-DE">German</option>
<option value="ar-SA">Arabic</option>
<option value="ja-JP">Japanese</option>
<option value="zh-CN">Chinese</option>
</select>
<input id="photo" type="file" accept="image/*" hidden>
<button type="button" id="photoBtn" title="Attach photo">📎</button>
<button type="button" id="voiceBtn">🎤</button>
<button type="button" id="liveTalkBtn" title="Start Live Talk">🎙️ Live Talk</button>

<button type="submit">Send</button>
</form>
<button id="selectDelete" type="button">☑️ Select messages to delete</button>
<button id="deleteSelected" type="button" hidden>🗑️ Delete selected</button>
<button id="delete">Delete Chat History</button>
</div>\n</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script>
const messages = document.getElementById("messages");

let sb;
let authMode = "login";

(async function setupAuth() {
  const authStatus = document.getElementById("authStatus");
  const authPanel = document.getElementById("authPanel");
  const chatArea = document.getElementById("chatArea");
  try {
    const configRes = await fetch("/api/config");
    if (!configRes.ok) throw new Error("Could not load Supabase config");
    const config = await configRes.json();
    sb = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

    document.getElementById("authToggle").addEventListener("click", () => {
      authMode = authMode === "login" ? "signup" : "login";
      document.getElementById("authSubmit").textContent = authMode === "login" ? "Login" : "Sign Up";
      document.getElementById("authToggle").textContent = authMode === "login" ? "Create new account" : "Back to Login";
      document.getElementById("authPassword").autocomplete = authMode === "login" ? "current-password" : "new-password";
      authStatus.textContent = authMode === "login" ? "Login to continue" : "Create your August AI account";
    });

    document.getElementById("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      authStatus.textContent = "Please wait...";
      const result = authMode === "signup"
        ? await sb.auth.signUp({ email, password })
        : await sb.auth.signInWithPassword({ email, password });

      if (result.error) {
        authStatus.textContent = result.error.message;
      } else if (authMode === "signup" && !result.data.session) {
        authStatus.textContent = "Account created. Please verify your email, then login.";
      } else {
        authStatus.textContent = "Login successful";
      }
    });

    async function showSession(session) {
      authPanel.hidden = !!session;
      chatArea.hidden = !session;
      if (session) await loadHistory();
    }

    sb.auth.onAuthStateChange((_event, session) => {
      showSession(session);
    });

    const { data } = await sb.auth.getSession();
    await showSession(data.session);
  } catch (error) {
    authStatus.textContent = "Auth setup error: " + error.message;
  }
})();

async function apiFetch(url, options = {}) {
  const { data } = await sb.auth.getSession();
  if (!data.session) throw new Error("Please login first");
  const headers = new Headers(options.headers || {});
  headers.set("Authorization", "Bearer " + data.session.access_token);
  return fetch(url, { ...options, headers });
}
document.getElementById("photoBtn")?.addEventListener("click", () => {
    document.getElementById("photo").click();
  });
  document.getElementById("photo")?.addEventListener("change", () => {
    const file = document.getElementById("photo").files[0];
    if (file) {
      document.getElementById("message").placeholder = "Is photo ke baare mein kya poochna hai?";
      statusText.textContent = "Photo selected. Ab apna sawal likho aur Send dabao.";
    }
  });
const statusText = document.getElementById("status");

function cleanSpeechText(text) {
  return String(text)
    .replace(/\*\*(.*?)\*\*/g, "$1")
    .replace(/\*(.*?)\*/g, "$1")
    .replace(/[\`#_~]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}


function markdownToHtml(value) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const inline = s => esc(s)
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/`(.*?)`/g, "<code>$1</code>");

  const lines = String(value || "").split(/\r?\n/);
  let out = [], list = false, table = false;

  function closeList() {
    if (list) { out.push("</ul>"); list = false; }
  }
  function closeTable() {
    if (table) { out.push("</table>"); table = false; }
  }

  for (const line of lines) {
    const t = line.trim();
    if (!t) { closeList(); closeTable(); continue; }

    if (/^\|?\s*:?-{3,}/.test(t)) continue;

    if (t.includes("|")) {
      closeList();
      if (!table) { out.push('<table class="md-table">'); table = true; }
      const cells = t.replace(/^\||\|$/g, "").split("|");
      out.push("<tr>" + cells.map(c => "<td>" + inline(c.trim()) + "</td>").join("") + "</tr>");
      continue;
    }

    closeTable();
    if (/^[-*]\s+/.test(t)) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push("<li>" + inline(t.replace(/^[-*]\s+/, "")) + "</li>");
    } else {
      closeList();
      const h = t.match(/^#{1,3}\s+(.*)$/);
      out.push(h ? "<h3>" + inline(h[1]) + "</h3>" : "<p>" + inline(t) + "</p>");
    }
  }
  closeList();
  closeTable();
  return out.join("");
}

function addMessage(role, text, historyIndex = null) {
  text = String(text || "").replace(/^\s*\|[\s|:-]+\|\s*$/gm, "").trim();
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "ai");

  const label = document.createElement("span");
  label.innerHTML = (role === "user" ? "You: " : "AI: ") + (role === "user" ? markdownToHtml(text) : markdownToHtml(text));
  div.appendChild(label);
  if (historyIndex !== null) {
    const selectionBox = document.createElement("input");
    selectionBox.type = "checkbox";
    selectionBox.className = "selectionBox";
    selectionBox.dataset.index = historyIndex;
    selectionBox.hidden = true;
    div.prepend(selectionBox);
  }

  const ttsButton = document.createElement("button");
  ttsButton.type = "button";
  ttsButton.textContent = "🔊";
  ttsButton.title = "Listen to this message";
  ttsButton.addEventListener("click", () => {
    if (!("speechSynthesis" in window)) return;
    if (window.activeTtsButton === ttsButton) {
      window.speechSynthesis.cancel();
      window.activeTtsButton = null;
      ttsButton.textContent = "🔊";
      return;
    }
    window.speechSynthesis.cancel();
    document.querySelectorAll('.msg button[title="Listen to this message"]').forEach(b => b.textContent = "🔊");
    const utterance = new SpeechSynthesisUtterance(cleanSpeechText(text));
    utterance.lang = document.getElementById('voiceLanguage').value;
          utterance.rate = 1.08;
    window.activeTtsButton = ttsButton;
    ttsButton.textContent = "⏹";
    utterance.onend = utterance.onerror = () => {
      if (window.activeTtsButton === ttsButton) {
        window.activeTtsButton = null;
        ttsButton.textContent = "🔊";
      }
    };
    window.speechSynthesis.speak(utterance);
  });
  div.appendChild(ttsButton);

  if (historyIndex !== null) {

  }

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

document.getElementById("selectDelete").addEventListener("click", () => {
  const boxes = document.querySelectorAll(".selectionBox");
  const selecting = boxes.length > 0 && boxes[0].hidden;
  boxes.forEach(box => box.hidden = !selecting);
  document.getElementById("deleteSelected").hidden = !selecting;
  document.getElementById("selectDelete").textContent =
    selecting ? "☑️ Cancel selection" : "☑️ Select messages to delete";
});

document.getElementById("deleteSelected").addEventListener("click", async () => {
  const indexes = [...document.querySelectorAll(".selectionBox:checked")]
    .map(box => Number(box.dataset.index))
    .sort((a, b) => b - a);
  if (!indexes.length) {
    statusText.textContent = "Pehle messages select karo.";
    return;
  }
  if (!confirm(indexes.length + " selected messages delete karein?")) return;
  try {
    for (const index of indexes) {
      const res = await apiFetch("/api/history/" + index, { method: "DELETE" });
      if (!res.ok) throw new Error("Delete failed");
    }
    await loadHistory();
    document.getElementById("deleteSelected").hidden = true;
    document.getElementById("selectDelete").textContent = "☑️ Select messages to delete";
    statusText.textContent = "Selected messages deleted";
  } catch (error) {
    statusText.textContent = "Error: " + error.message;
  }
});

async function loadHistory() {
  try {
    const res = await apiFetch("/api/history");
    const history = await res.json();
    messages.innerHTML = "";
    history.forEach((item, index) => addMessage(item.role, item.content, index));
  } catch {
    statusText.textContent = "Could not load history";
  }
}

document.getElementById("form").addEventListener("submit", async event => {
  event.preventDefault();
  const input = document.getElementById("message");
  let message = input.value.trim();
  const photo = document.getElementById("photo").files[0];
  if (!message && !photo) {
    statusText.textContent = "Apna sawal likho ya photo select karo.";
    return;
  }
  if (!message && photo) message = "Is photo ko dekho aur batao ismein kya hai.";
  let image = "";
  if (photo) {
    if (photo.size > 10 * 1024 * 1024) {
      statusText.textContent = "Photo 10 MB se chhoti honi chahiye.";
      return;
    }
    image = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(photo);
    });
  }
  addMessage("user", message);
  input.value = "";
  document.getElementById("photo").value = "";
  statusText.textContent = "AI is thinking...";
  try {
    const res = await apiFetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message, image})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    addMessage("assistant", data.answer);
    statusText.textContent = "Reply received";
  } catch (error) {
    statusText.textContent = "Error: " + error.message;
  }
});

document.getElementById("delete").addEventListener("click", async () => {
  if (!confirm("Delete all saved chat history?")) return;
  try {
    const res = await apiFetch("/api/history", {method: "DELETE"});
    if (!res.ok) throw new Error("Could not delete history");
    messages.innerHTML = "";
    statusText.textContent = "Chat history deleted";
  } catch (error) {
    statusText.textContent = "Error: " + error.message;
  }
});


const voiceBtn = document.getElementById('voiceBtn');

if (voiceBtn) {
  voiceBtn.addEventListener('click', () => {
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Speech) {
      alert('Voice input is not supported in this browser. Try Chrome.');
      return;
    }

    const recognition = new Speech();
    recognition.lang = document.getElementById('voiceLanguage').value;
    recognition.interimResults = false;
    recognition.onresult = (event) => {
      document.getElementById('message').value =
        event.results[0][0].transcript;
    };
    recognition.onerror = () => alert('Mic error. Check microphone permission.');
    recognition.start();
  });
}


/* AugustLiveTalk */
(() => {
  const btn = document.getElementById("liveTalkBtn");
  const status = document.getElementById("status");
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!btn) return;
  let active = false, busy = false, recognition = null;

  btn.addEventListener("click", () => {
    if (active) {
      active = false;
      busy = false;
      if (recognition) recognition.abort();
      window.speechSynthesis.cancel();
      btn.textContent = "🎙️ Live Talk";
      status.textContent = "Live Talk stopped";
      return;
    }

    if (!SpeechRecognition) {
      status.textContent = "Live Talk ke liye Chrome browser use karo.";
      return;
    }

    active = true;
    btn.textContent = "⏹️ Stop Talk";
    status.textContent = "Listening... permission allow karo.";

    recognition = new SpeechRecognition();
    recognition.lang = document.getElementById('voiceLanguage').value;
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = async (event) => {
      const spoken = event.results[event.results.length - 1][0].transcript.trim();
      if (!spoken || busy || !active) return;
      busy = true;
      status.textContent = "August AI is thinking...";
      addMessage("user", spoken);

      try {
        const res = await apiFetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: spoken })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");

        const answer = String(data.answer || data.reply || "").replace(/^\s*\|[\s|:-]+\|\s*$/gm, "").trim();
        if (!answer) throw new Error("AI ka answer blank hai.");

        addMessage("assistant", answer);
        status.textContent = "August AI is speaking...";
        window.speechSynthesis.cancel();

        await new Promise(resolve => {
          const utterance = new SpeechSynthesisUtterance(cleanSpeechText(answer));
          utterance.lang = document.getElementById('voiceLanguage').value;
          utterance.rate = 1.08;
          utterance.onend = resolve;
          utterance.onerror = resolve;
          window.speechSynthesis.speak(utterance);
        });
      } catch (error) {
        status.textContent = "Error: " + error.message;
      } finally {
        busy = false;
        if (active) {
          status.textContent = "Listening... bolo.";
          setTimeout(() => {
            if (active && !busy) {
              try {
                recognition.start();
              } catch (error) {
                setTimeout(() => {
                  if (active && !busy) {
                    try { recognition.start(); }
                    catch (retryError) {
                      status.textContent = "Mic restart nahi hua. Live Talk dobara start karo.";
                    }
                  }
                }, 700);
              }
            }
          }, 700);
        }
      }
    };

    recognition.onerror = (event) => {
      if (active && event.error !== "aborted" && event.error !== "no-speech") {
        status.textContent = "Mic error: " + event.error;
      }
    };

    recognition.onend = () => {
      if (active && !busy) {
        setTimeout(() => {
          if (active && !busy) {
            try { recognition.start(); } catch {}
          }
        }, 500);
      }
    };

    try { recognition.start(); }
    catch (error) {
      active = false;
      btn.textContent = "🎙️ Live Talk";
      status.textContent = "Mic start nahi hua: " + error.message;
    }
  });
})();

</script>

<script>
document.addEventListener('click', function(e) {
  const target = e.target.closest('[data-speak]');
  if (!target) return;
  if (!('speechSynthesis' in window)) {
    alert('Speech playback is not supported in this browser.');
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(cleanSpeechText(target.dataset.speak));
  utterance.lang = document.getElementById('voiceLanguage').value;
          utterance.rate = 1.08;
  window.speechSynthesis.speak(utterance);
});
</script>
